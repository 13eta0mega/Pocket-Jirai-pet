name: Patch Jirai v1.2 semantic parts
on:
  push:
    branches: [Jirai_Ver1.1]
    paths: ['.github/workflows/patch-v12-semantics.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine eye semantics and deterministic QA blink
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cp=Path('config/jirai-v11.json')
          c=json.loads(cp.read_text())
          p=c['atlas']['parts']
          # Atlas row mapping verified against the supplied expression sheet:
          # surprise pair -> 202/306, sparkle pair -> 400/502,
          # closed arcs -> 791/892 @ y610, half/angry rows remain separate.
          p.update({
            'eyeWideL':[202,556,60,70],
            'eyeWideR':[306,556,66,70],
            'eyeSparkleL':[400,558,60,78],
            'eyeSparkleR':[502,558,60,78],
            'eyeClosedL':[791,610,57,20],
            'eyeClosedR':[892,610,58,21],
            'eyeHalfL':[791,450,52,23],
            'eyeHalfR':[879,449,53,20],
            'eyeAngryL':[792,497,43,20],
            'eyeAngryR':[889,496,43,19]
          })
          e=c['expressions']['eyes']
          e.update({
            'closedL':{'key':'eyeClosedL','w':58,'h':21,'dy':4},
            'closedR':{'key':'eyeClosedR','w':58,'h':21,'dy':4},
            'halfL':{'key':'eyeHalfL','w':56,'h':25},
            'halfR':{'key':'eyeHalfR','w':56,'h':23},
            'angryL':{'key':'eyeAngryL','w':56,'h':26},
            'angryR':{'key':'eyeAngryR','w':56,'h':25},
            'sparkleL':{'key':'eyeSparkleL','w':58,'h':70},
            'sparkleR':{'key':'eyeSparkleR','w':58,'h':70},
            'wideL':{'key':'eyeWideL','w':57,'h':66},
            'wideR':{'key':'eyeWideR','w':59,'h':66}
          })
          c['version']='1.2.1'
          cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')

          rp=Path('src/rig-engine.js')
          s=rp.read_text()
          s=s.replace("excited:     {label:'신남', parts:{eye:'wide', mouth:'happyOpen', arm:'bent'}", "excited:     {label:'신남', parts:{eye:'sparkle', mouth:'happyOpen', arm:'bent'}")
          s=s.replace("if(style==='half'||style==='angry')return side==='L'?E.halfL:E.halfR;", "if(style==='half')return side==='L'?E.halfL:E.halfR;if(style==='angry')return side==='L'?E.angryL:E.angryR;")
          s=s.replace("updateBlink(now){\n      if(this.blinkStart<0", "updateBlink(now,qa=false){\n      if(qa && this.blinkStart<0){this.blinkL=this.blinkR=1;return;}\n      if(this.blinkStart<0")
          s=s.replace("this.updateBlink(now); this.updateIdle(now,dt,qa);", "this.updateBlink(now,qa); this.updateIdle(now,dt,qa);")
          rp.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/jirai-v11.json src/rig-engine.js
          git commit -m 'Refine expression atlas mapping and QA blink' || exit 0
          git pull --rebase origin Jirai_Ver1.1 || true
          git push
