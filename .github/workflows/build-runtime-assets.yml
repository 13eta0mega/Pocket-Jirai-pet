name: Build stable runtime v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_stable_runtime_v4.py'
      - 'tools/requirements.txt'
      - 'assets/generated/poses/**'
      - 'assets/generated/expressions/**'
      - 'assets/generated/sprites/**'
      - '.github/workflows/build-runtime-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Build fixed-canvas runtime
        run: python tools/build_stable_runtime_v4.py

      - name: Validate 3 MiB budget and outputs
        run: |
          cat qa/runtime-v4/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('qa/runtime-v4/report.json').read_text())
          if not report['qa_pass']:
              raise SystemExit('Runtime QA failed')
          if report['runtime_png_bytes'] > 3 * 1024 * 1024:
              raise SystemExit('Runtime asset budget exceeded')
          manifest = json.loads(Path('assets/runtime-v4/manifest.json').read_text())
          if len(manifest['states']) != 16:
              raise SystemExit('Expected exactly 16 states')
          print('Stable runtime QA: PASS')
          PY

      - name: Commit generated stable runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime-v4 qa/runtime-v4
          if git diff --cached --quiet; then
            echo 'No runtime changes.'
          else
            git commit -m 'Build stable full-sprite runtime v4 [skip ci]'
            git push
          fi
