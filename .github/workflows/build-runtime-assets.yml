name: Build reference runtime v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_reference_runtime_v5.py'
      - 'tools/requirements.txt'
      - 'assets/original/**'
      - 'assets/generated/expressions/expression_sheet_cute_gothic_bunny_girl_01.png'
      - '.github/workflows/build-runtime-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Verify original reference sprites exist
        run: |
          for f in jirai_stand.png jirai_jump.png jirai_peace.png jirai_uruuru.png jirai_gorogoro.png jirai_haku.png; do
            test -f "assets/original/$f" || { echo "Missing assets/original/$f"; exit 1; }
          done

      - name: Build reference-locked fixed-canvas runtime
        run: python tools/build_reference_runtime_v5.py

      - name: Validate strict runtime QA
        run: |
          cat qa/runtime-v5/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('qa/runtime-v5/report.json').read_text())
          if not r['qa_pass']:
              raise SystemExit('Runtime QA failed')
          if r['runtime_png_bytes'] > 3 * 1024 * 1024:
              raise SystemExit('3 MiB budget exceeded')
          if r.get('unique_state_sprites') != 16:
              raise SystemExit('Emotion state sprites are not all unique')
          if r.get('duplicate_state_groups'):
              raise SystemExit(f"Duplicate states: {r['duplicate_state_groups']}")
          m = json.loads(Path('assets/runtime-v5/manifest.json').read_text())
          if len(m['states']) != 16:
              raise SystemExit('Expected 16 states')
          if m['canvas'] != [320, 320]:
              raise SystemExit('Unexpected runtime canvas')
          print('Reference runtime v5 strict QA: PASS')
          PY

      - name: Commit generated runtime outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime-v5 qa/runtime-v5
          if git diff --cached --quiet; then
            echo 'No runtime changes.'
          else
            git commit -m 'Build reference-locked runtime v5 [skip ci]'
            git push
          fi
