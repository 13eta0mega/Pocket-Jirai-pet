name: Build runtime assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_runtime_assets.py'
      - 'tools/refine_runtime_parts.py'
      - 'tools/repack_runtime_atlas.py'
      - 'tools/generate_firmware_tables.py'
      - 'tools/requirements.txt'
      - 'assets/generated/**'
      - 'config/runtime_asset_plan.json'
      - 'config/emotions_v0.json'
      - '.github/workflows/build-runtime-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Build runtime parts
        run: python tools/build_runtime_assets.py

      - name: Refine hair and twin-tail masks
        run: python tools/refine_runtime_parts.py

      - name: Repack and validate atlas bounds
        run: python tools/repack_runtime_atlas.py

      - name: Generate ESP32-friendly tables
        run: python tools/generate_firmware_tables.py

      - name: Show runtime size
        run: |
          du -ah assets/runtime | sort -h
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('assets/runtime')
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'Runtime assets total: {total} bytes ({total/1024:.1f} KiB)')
          if total > 3 * 1024 * 1024:
              raise SystemExit('Runtime asset budget exceeded: 3 MiB')

          manifest = json.loads((root / 'jirai_runtime_atlas_v0.json').read_text())
          width, height = manifest['size']
          for name, (x, y, w, h) in manifest['rects'].items():
              if x < 0 or y < 0 or x + w > width or y + h > height:
                  raise SystemExit(f'Atlas rect out of bounds: {name} -> {(x,y,w,h)}')
          print('Atlas bounds QA: PASS')
          PY

      - name: Commit generated runtime outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime firmware/generated
          if git diff --cached --quiet; then
            echo 'No runtime output changes.'
          else
            git commit -m 'Build runtime atlas and firmware tables [skip ci]'
            git push
          fi
