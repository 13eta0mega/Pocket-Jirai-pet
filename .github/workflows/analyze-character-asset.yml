name: Analyze Jirai Character Asset

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'src/Jirai_Character_Asset.png'
      - '.github/workflows/analyze-character-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Create focused inspection regions
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import base64, io, json, shutil

          src=Path('src/Jirai_Character_Asset.png')
          out=Path('debug/regions')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True,exist_ok=True)
          im=Image.open(src).convert('RGBA')
          w,h=im.size
          regions={
            'main':(0,0,332,500),
            'top_center':(320,0,590,430),
            'top_right':(890,0,364,430),
            'mid_left':(0,400,630,380),
            'mid_right':(620,400,634,380),
            'bottom_left':(0,760,630,494),
            'bottom_right':(620,760,634,494),
          }
          info={'source':str(src),'width':w,'height':h,'regions':{}}
          for name,(x,y,rw,rh) in regions.items():
            x2=min(w,x+rw); y2=min(h,y+rh)
            crop=im.crop((x,y,x2,y2))
            # Checker background so transparency and part edges remain visible.
            bg=Image.new('RGB',crop.size,(238,238,242)); d=ImageDraw.Draw(bg)
            s=20
            for yy in range(0,crop.height,s):
              for xx in range(0,crop.width,s):
                if ((xx//s)+(yy//s))%2: d.rectangle((xx,yy,xx+s-1,yy+s-1),fill=(215,216,222))
            bg.paste(crop,(0,0),crop)
            bg.thumbnail((220,220),Image.Resampling.LANCZOS)
            bio=io.BytesIO(); bg.save(bio,'JPEG',quality=68,optimize=True)
            b64=base64.b64encode(bio.getvalue()).decode('ascii')
            chunks=[b64[i:i+3800] for i in range(0,len(b64),3800)]
            rd=out/name; rd.mkdir()
            for i,ch in enumerate(chunks): (rd/f'{i:02d}.txt').write_text(ch)
            info['regions'][name]={'source_rect':[x,y,x2-x,y2-y],'preview':[bg.width,bg.height],'jpeg_bytes':len(bio.getvalue()),'chunks':len(chunks)}
          Path('debug/asset_preview_info.json').write_text(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
      - name: Commit inspection regions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/regions debug/asset_preview_info.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate focused character inspection regions [skip ci]'
          git push
