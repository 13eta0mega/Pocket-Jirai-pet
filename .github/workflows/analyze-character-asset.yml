name: Analyze Jirai Character Asset

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'src/Jirai_Character_Asset.png'
      - '.github/workflows/analyze-character-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Create inspection tiles
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, io, json
          src=Path('src/Jirai_Character_Asset.png')
          out=Path('debug/tiles'); out.mkdir(parents=True,exist_ok=True)
          im=Image.open(src).convert('RGBA')
          w,h=im.size
          info={'source':str(src),'width':w,'height':h,'tiles':[]}
          for row in range(3):
            for col in range(3):
              x0=round(col*w/3); x1=round((col+1)*w/3)
              y0=round(row*h/3); y1=round((row+1)*h/3)
              crop=im.crop((x0,y0,x1,y1)).convert('RGB')
              crop.thumbnail((96,96),Image.Resampling.LANCZOS)
              bio=io.BytesIO(); crop.save(bio,'JPEG',quality=42,optimize=True)
              name=f'tile_{row}_{col}'
              (out/f'{name}.b64.txt').write_text(base64.b64encode(bio.getvalue()).decode('ascii'))
              info['tiles'].append({'name':name,'source_rect':[x0,y0,x1-x0,y1-y0],'preview':[crop.width,crop.height],'bytes':len(bio.getvalue())})
          Path('debug/asset_preview_info.json').write_text(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
      - name: Commit debug tiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/tiles debug/asset_preview_info.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate character asset inspection tiles [skip ci]'
          git push
