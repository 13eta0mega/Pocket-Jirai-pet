name: Analyze Jirai Character Asset

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'src/Jirai_Character_Asset.png'
      - '.github/workflows/analyze-character-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Create micro preview
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, io, json
          src=Path('src/Jirai_Character_Asset.png')
          out=Path('debug'); out.mkdir(exist_ok=True)
          im=Image.open(src).convert('RGBA')
          w,h=im.size
          p=im.convert('RGB'); p.thumbnail((64,64),Image.Resampling.LANCZOS)
          bio=io.BytesIO(); p.save(bio,'JPEG',quality=35,optimize=True)
          (out/'asset_preview.b64.txt').write_text(base64.b64encode(bio.getvalue()).decode('ascii'))
          info={'source':str(src),'width':w,'height':h,'preview_width':p.width,'preview_height':p.height,'preview_bytes':len(bio.getvalue())}
          (out/'asset_preview_info.json').write_text(json.dumps(info,indent=2))
          print(info)
          PY
      - name: Commit debug preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/asset_preview.b64.txt debug/asset_preview_info.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh micro asset preview [skip ci]'
          git push
