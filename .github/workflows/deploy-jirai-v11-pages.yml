name: Deploy Jirai Ver1.1 Pages

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'config/jirai-v11.json'
      - '.github/workflows/deploy-jirai-v11-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jirai-v11-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jirai Ver1.1
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
