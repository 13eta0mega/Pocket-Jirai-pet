name: QA Jirai Ver1.1 Browser Rig

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/app.js'
      - 'src/rig-engine.js'
      - 'src/Jirai_Character_Asset.png'
      - 'config/jirai-v11.json'
      - 'tools/qa_browser.mjs'
      - 'tools/qa_hosted.mjs'
      - '.github/workflows/qa-jirai-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jirai-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Run local interaction and render QA
        run: node tools/qa_browser.mjs
      - name: Run externally hosted page diagnostic
        continue-on-error: true
        run: node tools/qa_hosted.mjs
      - name: Commit QA reports and textual preview
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/jirai-v11 qa/hosted || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Jirai Ver1.1 browser QA [skip ci]'
          git pull --rebase origin Jirai_Ver1.1 || true
          git push

# QA revision: local WebGL rig plus externally hosted-page verification.
