name: Upgrade Jirai Ver1.1 Motion

on:
  push:
    branches: [Jirai_Ver1.1]
    paths:
      - 'tools/upgrade_v11_motion.py'
      - '.github/workflows/upgrade-v11-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply motion upgrade
        run: python3 tools/upgrade_v11_motion.py
      - name: Syntax check
        run: |
          node --check src/rig-engine.js
          node --check src/app.js
          node --check tools/qa_browser.mjs
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rig-engine.js src/app.js tools/qa_browser.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Upgrade Jirai Ver1.1 atlas mouth and limb motion'
          git push
