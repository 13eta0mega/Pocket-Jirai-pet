name: Deploy Jirai Ver1.2 Pages

on:
  push:
    branches: [Jirai_Ver1.2]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'config/jirai-v12.json'
      - '.github/workflows/deploy-jirai-v12-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pocket-jirai-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout Jirai Ver1.1
        uses: actions/checkout@v4
        with:
          ref: Jirai_Ver1.1
          path: v11
      - name: Checkout Jirai Ver1.2
        uses: actions/checkout@v4
        with:
          ref: Jirai_Ver1.2
          path: v12
      - name: Build versioned Pages bundle
        id: bundle
        run: |
          rm -rf site/.git site/.github
          mkdir -p site/Jirai_Ver1.1 site/Jirai_Ver1.2
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='qa' v11/ site/Jirai_Ver1.1/
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='qa' v12/ site/Jirai_Ver1.2/
          touch site/.nojekyll
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted Ver1.2 files
        id: hosted
        run: |
          set +e
          base="${{ steps.deployment.outputs.page_url }}Jirai_Ver1.2/"
          ok=0
          for i in $(seq 1 20); do
            html=$(curl -fsSL --max-time 15 "${base}index.html")
            cfg=$(curl -fsSL --max-time 15 "${base}config/jirai-v12.json")
            js=$(curl -fsSL --max-time 15 "${base}src/rig-engine.js")
            if printf '%s' "$html" | grep -q 'JIRAI VER1.2' && printf '%s' "$cfg" | grep -q '1.2.0-part-rig' && printf '%s' "$js" | grep -q 'Sprite parts + micro-mesh'; then
              ok=1
              break
            fi
            sleep 3
          done
          mkdir -p v12/qa/jirai-v12
          if [ "$ok" = "1" ]; then
            printf '{"url":"%s","index":true,"config":true,"renderer":true,"pass":true}\n' "$base" > v12/qa/jirai-v12/hosted.json
            exit 0
          else
            printf '{"url":"%s","pass":false,"message":"Hosted Ver1.2 files were not verified after deployment."}\n' "$base" > v12/qa/jirai-v12/hosted.json
            exit 1
          fi
      - name: Publish hosted verification
        if: always()
        run: |
          mkdir -p v12/qa/jirai-v12
          if [ ! -f v12/qa/jirai-v12/hosted.json ]; then
            printf '%s\n' '{"stage":"deploy-not-complete","bundle":"${{ steps.bundle.outcome }}","configure":"${{ steps.pages.outcome }}","upload":"${{ steps.upload.outcome }}","deploy":"${{ steps.deployment.outcome }}","hosted":"${{ steps.hosted.outcome }}","pass":false}' > v12/qa/jirai-v12/hosted.json
          fi
          cd v12
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/jirai-v12/hosted.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Jirai Ver1.2 hosted QA [skip ci]"
            git push origin HEAD:Jirai_Ver1.2
          fi
