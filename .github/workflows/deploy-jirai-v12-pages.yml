name: Deploy Jirai Ver1.2 Pages

on:
  push:
    branches: [Jirai_Ver1.2]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'config/jirai-v12.json'
      - '.github/workflows/deploy-jirai-v12-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pocket-jirai-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout Jirai Ver1.1
        uses: actions/checkout@v4
        with:
          ref: Jirai_Ver1.1
          path: v11
      - name: Checkout Jirai Ver1.2
        uses: actions/checkout@v4
        with:
          ref: Jirai_Ver1.2
          path: v12
      - name: Build versioned Pages bundle
        run: |
          rm -rf site/.git site/.github
          mkdir -p site/Jirai_Ver1.1 site/Jirai_Ver1.2
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='qa' v11/ site/Jirai_Ver1.1/
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='qa' v12/ site/Jirai_Ver1.2/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
